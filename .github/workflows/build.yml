# The checks that define "done" (CLAUDE.md, Build and test), on every pull request and every push to main.
name: Build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash # with pipefail, so a failure before `| tee` fails the step

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: echo "::notice::$(xcodebuild -version | tr '\n' ' ')"
      # Each check repeats its first errors as annotations (GitHub shows 10 per step), so the run's summary shows why it failed.
      # xcodebuild, not swift test: SwiftPM before Xcode 27 doesn't compile String Catalogs, so every German lookup fails.
      - name: Core tests
        working-directory: Core
        run: xcodebuild test -scheme Core -destination 'platform=macOS' 2>&1 | tee ../check.log || { grep -E "recorded an issue|: error:|exited with|crashed" ../check.log | grep -v Connection | head -10 | sed 's/^/::error::/'; exit 1; }
      - name: Build iPhone, watch and complication
        run: xcodebuild -project MuscleGrail.xcodeproj -scheme MuscleGrail -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build 2>&1 | tee check.log || { grep -E ": error:" check.log | grep -v Connection | head -10 | sed 's/^/::error::/'; exit 1; }
      - name: Build Mac
        run: xcodebuild -project MuscleGrail.xcodeproj -scheme MuscleGrail -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build 2>&1 | tee check.log || { grep -E ": error:" check.log | grep -v Connection | head -10 | sed 's/^/::error::/'; exit 1; }
