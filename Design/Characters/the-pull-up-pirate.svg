<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- The Pull-Up Pirate (Der Klimmzug-Pirat), a plan character of Muscle Grail. A browser renders it (the white rim is an SVG filter)
       to the 512 px PNG Core/Sources/Core/Characters/the-pull-up-pirate.png with a transparent background. -->
  <defs>
    <filter id="rim" filterUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <feMorphology in="SourceAlpha" operator="dilate" radius="9" result="grown"/>
      <feFlood flood-color="#FFFFFF"/>
      <feComposite in2="grown" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#rim)" stroke="#1D2340" stroke-width="10" stroke-linejoin="round" stroke-linecap="round">
    
