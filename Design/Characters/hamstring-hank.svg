<ellipse cx="166" cy="304" rx="26" ry="16" fill="#FF7A90" opacity="0.55" stroke="none"/><ellipse cx="346" cy="304" rx="26" ry="16" fill="#FF7A90" opacity="0.55" stroke="none"/>
