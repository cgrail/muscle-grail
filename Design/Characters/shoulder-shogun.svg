  <!-- Shoulder Shogun (Schulter-Schogun), a plan character of Muscle Grail. A browser renders it (the white rim is an SVG filter)
       to the 512 px PNG Core/Sources/Core/Characters/shoulder-shogun.png with a transparent background. -->
  <defs>
