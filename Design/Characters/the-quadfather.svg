<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- The Quadfather (Der Quadfather), a plan character of Muscle Grail. A browser renders it (the white rim is an SVG filter)
       to the 512 px PNG Core/Sources/Core/Characters/the-quadfather.png with a transparent background. -->
  <defs>
