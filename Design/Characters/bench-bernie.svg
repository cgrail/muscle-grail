<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Bench Bernie (Brust-Bernd), a plan character of Muscle Grail. A browser renders it (the white rim is an SVG filter)
       to the 512 px PNG Core/Sources/Core/Characters/bench-bernie.png with a transparent background. -->
  <defs>
    <filter id="rim" filterUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <feMorphology in="SourceAlpha" operator="dilate" radius="9" result="grown"/>
      <feFlood flood-color="#FFFFFF"/>
      <feComposite in2="grown" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#rim)" stroke="#1D2340" stroke-width="10" stroke-linejoin="round" stroke-linecap="round">
    
<circle cx="162" cy="86" r="40" fill="#A86B3C"/><circle cx="350" cy="86" r="40" fill="#A86B3C"/>
<circle cx="162" cy="86" r="18" fill="#E8C39E" stroke="none"/><circle cx="350" cy="86" r="18" fill="#E8C39E" stroke="none"/>
<path d="M190 448 h50 v20 h-62 Z M322 448 h-50 v20 h62 Z" fill="#7A4A26"/>
<ellipse cx="256" cy="360" rx="150" ry="104" fill="#A86B3C"/>
<path d="M190 392 Q222 418 254 392 M258 392 Q290 418 322 392" fill="none" stroke-width="8"/>
