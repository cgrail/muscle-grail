<ellipse cx="256" cy="214" rx="54" ry="40" fill="#E8C39E"/>
<ellipse cx="256" cy="196" rx="20" ry="13" fill="#1D2340" stroke="none"/>
<path d="M240 226 Q256 240 272 226" fill="none" stroke-width="7"/>
<circle cx="210" cy="160" r="13" fill="#1D2340" stroke="none"/><circle cx="206" cy="156" r="4" fill="#FFFFFF" stroke="none"/><circle cx="302" cy="160" r="13" fill="#1D2340" stroke="none"/><circle cx="298" cy="156" r="4" fill="#FFFFFF" stroke="none"/>
